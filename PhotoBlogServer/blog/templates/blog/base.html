<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Blog · 공통평가 01</title>
<style>body{font-family:Arial,'Malgun Gothic',sans-serif;margin:0;color:#182b42;background:#f3f6fb}header{background:#142c45;color:white;padding:24px max(5vw,24px);display:flex;justify-content:space-between;align-items:center}header a{color:white;text-decoration:none;margin-right:18px}main{max-width:1100px;margin:32px auto;padding:0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px}.card{background:white;border:1px solid #dce4ee;border-radius:14px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.body{padding:22px}.tag{color:#24716f;font-size:13px;font-weight:bold}.muted{color:#687a8e}input,textarea{padding:12px;border:1px solid #a8b7c8;border-radius:7px;font:inherit;box-sizing:border-box}input:not([type=file]),textarea{max-width:100%}button,.button{padding:12px 20px;background:#246b72;color:white;border:0;border-radius:7px;cursor:pointer;text-decoration:none}form.editor{max-width:720px;background:white;padding:26px;border-radius:14px}form.editor input,form.editor textarea{width:100%}.errorlist{color:#ae2431}h1{font-size:30px}h2{font-size:22px}a{color:#185b84}.search{display:flex;gap:8px;margin:24px 0}.detail{max-width:850px}.detail img{width:100%;max-height:550px;object-fit:contain;background:#edf1f7}</style></head>
<body><header><a href="/" style="font-size:24px;font-weight:bold">PHOTO BLOG</a><nav><a href="/api_root/Post/">REST API</a>{% if user.is_authenticated %}<a href="/post/new/">새 게시글</a><span>{{ user.username }}</span>{% else %}<a href="/accounts/login/">로그인</a>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main></body></html>
