plugins { id 'com.android.application' }
android {
    namespace 'com.example.photoviewer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.photoviewer'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.example.photoviewer.EvidenceRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.4.0' }

